name: Terraform DevSecOps CI-CD

on:
  pull_request:
    branches:
      - main
    paths:
      - 'environment/**'
      - 'modules/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'environment/**'
      - 'modules/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  TF_VERSION: '1.9.8'
  TF_WORKING_DIR_PREPROD: './environment/preprod'
  TF_WORKING_DIR_PROD: './environment/prod'

jobs:
  # ==========================================================
  # PR - DEVSECOPS CHECKS (Preprod)
  # ==========================================================
  terraform-security:
    name: Terraform DevSecOps Checks
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tool checks
      - name: Check Terraform
        shell: powershell
        run: terraform version

      - name: Check Azure CLI
        shell: powershell
        run: az version

      - name: Check Gitleaks
        shell: powershell
        run: gitleaks version

      - name: Check TFLint
        shell: powershell
        run: tflint --version

      # Azure Login
      - name: Azure Login
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal `
            --username "$env:AZURE_CLIENT_ID" `
            --password "$env:AZURE_CLIENT_SECRET" `
            --tenant "$env:AZURE_TENANT_ID"
          az account set --subscription "$env:AZURE_SUBSCRIPTION_ID"
          az account show

      # Terraform steps (Preprod)
      - name: Terraform Init
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR_PREPROD }}
        run: terraform init -input=false

      - name: Terraform Format Check
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR_PREPROD }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR_PREPROD }}
        run: terraform validate

      - name: Gitleaks Secret Scan
        shell: powershell
        run: gitleaks detect --source . --verbose --redact

      - name: TFLint Init
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR_PREPROD }}
        run: tflint --init

      - name: TFLint
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR_PREPROD }}
        run: tflint --format compact

      - name: Terraform Plan
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR_PREPROD }}
        run: terraform plan -input=false -out=tfplan

      - name: Show Plan
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR_PREPROD }}
        run: terraform show -no-color tfplan

  # ==========================================================
  # MAIN - TERRAFORM APPLY (Prod)
  # ==========================================================
  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    environment:
      name: prod   # 👈 requires approval in GitHub Environments

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Terraform
        shell: powershell
        run: terraform version

      - name: Check Azure CLI
        shell: powershell
        run: az version

      - name: Azure Login
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal `
            --username "$env:AZURE_CLIENT_ID" `
            --password "$env:AZURE_CLIENT_SECRET" `
            --tenant "$env:AZURE_TENANT_ID"
          az account set --subscription "$env:AZURE_SUBSCRIPTION_ID"
          az account show

      # Terraform steps (Prod)
      - name: Terraform Init
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR_PROD }}
        run: terraform init -input=false

      - name: Terraform Validate
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR_PROD }}
        run: terraform validate

      - name: Terraform Plan
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR_PROD }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR_PROD }}
        run: terraform apply -input=false -auto-approve tfplan
